version: '3.4'

services:
  postgres:
    container_name: threads_db
    image: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: threads
      POSTGRES_PASSWORD: threads
  # redis:
  #   image: redis
  #   ports:
  #     - "6379:6379"


volumes:
  postgres_data:
